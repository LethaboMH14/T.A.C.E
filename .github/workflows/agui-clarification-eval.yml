name: T.A.C.E AG-UI clarification integration evaluation

on:
  push:
    branches: [main]
    paths:
      - 'tools/integrations/agui/**'
      - '.github/workflows/agui-clarification-eval.yml'
  pull_request:
    paths:
      - 'tools/integrations/agui/**'
      - '.github/workflows/agui-clarification-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-spike:
    name: AG-UI event and clarification boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - name: Show Node runtime
        run: node --version
      - name: Run isolated AG-UI adapter tests (no SaaS credentials)
        run: node --test tools/integrations/agui/tace-clarification-events.test.mjs tools/integrations/agui/demo/goal-wizard-state.test.mjs
      - name: Syntax check browser UI module
        run: node --check tools/integrations/agui/demo/app.mjs
      - name: Validate emitted events against pinned AG-UI 1.0 upstream schema
        shell: bash
        run: |
          python3 -m venv /tmp/tace-agui-schema-venv
          /tmp/tace-agui-schema-venv/bin/python -m pip install --disable-pip-version-check jsonschema==4.23.0
          node tools/integrations/agui/write-protocol-fixtures.mjs | /tmp/tace-agui-schema-venv/bin/python tools/integrations/agui/verify-official-schema.py
