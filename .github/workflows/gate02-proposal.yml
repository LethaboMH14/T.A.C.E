name: T.A.C.E Gate 02.02 proposal contract tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/gate02/**'
      - '.github/workflows/gate02-proposal.yml'
  pull_request:
    paths:
      - 'tools/gate02/**'
      - '.github/workflows/gate02-proposal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposal:
    name: G02.01 + G02.02 deterministic contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # checkout v4, pinned
      - name: Node runtime
        run: node --version
      - name: Run both intake and proposal tests
        run: node --test tools/gate02/normalize-turn.test.mjs tools/gate02/goal-proposal.test.mjs
